name: 股市报告

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 北京时间 08:30 早报
    - cron: "0 13 * * 1-5"   # 北京时间 21:00 晚报
  workflow_dispatch:
    inputs:
      session:
        description: "morning / evening / adhoc"
        default: "adhoc"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 生成报告
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DATA_PROVIDERS: ${{ secrets.DATA_PROVIDERS }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.session }}" ]; then S="${{ github.event.inputs.session }}";
          elif [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then S=morning; else S=evening; fi
          python -m stock_agent --session "$S" --push
      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "report: $(date -u +%F) ${{ github.event.schedule || 'manual' }}"
          git push
