name: windows-portable
# 发布 Release 时：Linux 上交叉打包 Stoa-Windows.zip → Windows 真机自检（双击 Stoa.exe、开独立窗口、静默卸载）→ 过了才挂到 Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip nsis
      - run: bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Stoa-Windows
          path: |
            dist/Stoa-Windows.zip
            dist/Stoa-Setup.exe

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Stoa-Windows}
      - name: 静默安装 Stoa-Setup.exe
        shell: pwsh
        run: |
          Start-Process -FilePath ".\Stoa-Setup.exe" -ArgumentList "/S" -Wait
          $d = "$env:LOCALAPPDATA\Programs\Stoa"
          if (-not (Test-Path "$d\Stoa.exe")) { throw "没装到 $d" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Stoa.lnk"
          if (-not (Test-Path $lnk)) { throw "桌面没有快捷方式" }
          Write-Host "安装通过：$d，桌面快捷方式已建"
      - name: 从安装目录启动自检
        shell: pwsh
        env:
          STOA_SMOKE: "1"
          STOCK_AGENT_HOME: C:\stoa-data
          LLM_PROVIDER: ollama
          STOA_LOG: "1"
        run: |
          New-Item -ItemType Directory -Force C:\stoa-data | Out-Null
          Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Stoa\Stoa.exe"
          $f = "C:\stoa-data\smoke.json"
          for ($i = 0; $i -lt 150 -and -not (Test-Path $f); $i++) { Start-Sleep 2 }
          if (Test-Path C:\stoa-data\stoa.log) { Get-Content C:\stoa-data\stoa.log -Encoding utf8 }
          if (-not (Test-Path $f)) { throw "5 分钟内没有生成 smoke.json" }
          $r = Get-Content $f -Encoding utf8 | ConvertFrom-Json
          $r | Format-List | Out-String | Write-Host
          if (-not $r.ok) { throw "自检没通过" }
      - name: 静默卸载
        shell: pwsh
        run: |
          $d = "$env:LOCALAPPDATA\Programs\Stoa"
          Start-Process -FilePath "$d\Uninstall.exe" -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $d); $i++) { Start-Sleep 1 }
          if (Test-Path $d) { Get-ChildItem $d; throw "卸载后程序文件夹还在" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Stoa.lnk"
          if (Test-Path $lnk) { throw "卸载后桌面快捷方式还在" }
          if (-not (Test-Path C:\stoa-data\smoke.json)) { throw "卸载不该删除数据" }
          Write-Host "卸载通过：程序和快捷方式已删除，数据保留"

  publish:
    needs: smoke
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Stoa-Windows}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Stoa-Setup.exe
            Stoa-Windows.zip
