name: regression-tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      STOCK_AGENT_HOME: ${{ github.workspace }}/test-data
      EMBEDDINGS: local
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Build isolated code runner
        if: runner.os == 'Linux'
        run: docker build -t stoa-sandbox:local packaging/sandbox
      - name: Verify real container boundaries
        if: runner.os == 'Linux'
        env:
          STOA_SANDBOX_TEST: '1'
        run: python -m pytest -q tests/test_sandbox_container.py
