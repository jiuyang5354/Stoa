    "0700.HK": {date: "2026-10-28", close: 512.4, chg_pct: 2.35, chg_5d: 4.12, chg_20d: 7.86, ma20: 498.21, ma60: 470.55, rsi: 63.2, high_52w: 530.0, low_52w: 365.2, signals: ["上穿 20 日线"]}
    "600519.SS": {date: "2026-10-28", close: 1354.0, chg_pct: -0.84, chg_5d: -2.31, chg_20d: -5.47, ma20: 1398.6, ma60: 1421.3, rsi: 38.4, high_52w: 1688.0, low_52w: 1301.5, signals: []}
    "AAPL": {date: "2026-10-27", close: 343.83, chg_pct: 1.12, chg_5d: 2.05, chg_20d: 6.31, ma20: 331.4, ma60: 318.9, rsi: 66.8, high_52w: 349.1, low_52w: 228.4, signals: []}
    "NVDA": {date: "2026-10-27", close: 201.37, chg_pct: -2.41, chg_5d: -4.88, chg_20d: 3.17, ma20: 205.12, ma60: 188.43, rsi: 72.6, high_52w: 215.8, low_52w: 121.6, signals: ["RSI 超买", "单日大跌"]}
    "9988.HK": {date: "2026-10-28", close: 158.9, chg_pct: 0.63, chg_5d: 1.9, chg_20d: -3.4, ma20: 161.2, ma60: 149.7, rsi: 49.5, high_52w: 182.0, low_52w: 98.3, signals: []}
  announcements:
    "600519.SS": [{date: "2026-10-25", title: "贵州茅台2026年第三季度报告", url: "https://data.eastmoney.com/notices/detail/600519/AN202610251.html"},
                  {date: "2026-10-10", title: "贵州茅台关于回购股份实施进展的公告", url: "https://data.eastmoney.com/notices/detail/600519/AN202610101.html"}]
    "AAPL": [{date: "2026-10-24", title: "10-Q Quarterly report", url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000320193"},
             {date: "2026-10-02", title: "8-K Current report", url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000320193"}]
    "0700.HK": [{date: "2026-10-28", title: "腾讯控股：翌日披露报表（股份购回）", url: "https://www.hkexnews.hk/0700-20261028"}]
  news:
    "0700.HK": [{time: "2026-10-28 16:20", title: "腾讯连续第十日回购，单日斥资 10 亿港元", source: "东方财富", url: "https://finance.eastmoney.com/a/202610283301.html"},
                {time: "2026-10-28 11:05", title: "港股科技股走强，恒生科技指数涨超 2%", source: "东方财富", url: "https://finance.eastmoney.com/a/202610283188.html"}]
  financials:
