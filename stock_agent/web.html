<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股市 Agent</title>
<!--
  控件参考 21st.dev（只参考视觉与交互，原生重写，无构建步骤）：
  Ticker #19171 · Market Snapshot #22249 · Sparkline #35038 · AI Chat Input #2015
  Suggestions #26546 · Text Dots #28400
-->
<style>
  :root{
    --bg:#f4f1ea;--card:#fbfaf6;--ink:#1d1d1b;--mute:#8a857b;--line:color-mix(in srgb,var(--ink) 9%,transparent);
    --up:#c8102e;--down:#16794a;--accent:#c8102e;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.36,.64,1);
    --serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC",serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column;overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.down{color:var(--down)}

  /* ---- Ticker（参考 21st Ticker #19171） ---- */
  .ticker{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);flex:none}
  .ticker-track{display:inline-flex;gap:44px;padding:11px 22px;animation:marquee 60s linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  @keyframes marquee{to{transform:translateX(-50%)}}
  .tk{display:inline-flex;align-items:baseline;gap:9px;cursor:pointer;font-size:14px;opacity:.92;transition:opacity .2s}
  .tk:hover{opacity:1}
  .tk b{font-weight:600}
  .tk .p{color:var(--mute)}
  .tk .c{font-weight:600}
  .tk .tri{font-size:10px;margin-right:2px}

  .wrap{flex:1;display:flex;min-height:0}
  main{flex:1;display:flex;flex-direction:column;min-width:0;max-width:820px;margin:0 auto;padding:0 32px}
  header{padding:26px 0 14px;display:flex;align-items:baseline;justify-content:space-between}
  h1{font:600 26px/1 var(--serif);margin:0;letter-spacing:.02em}
  .tag{font:11px var(--mono);color:var(--mute);letter-spacing:.14em}
  #log{flex:1;overflow:auto;padding:14px 0 24px;scrollbar-width:thin}
  .m{margin:0 0 22px;animation:rise .45s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .who{font:11px var(--mono);letter-spacing:.14em;color:var(--mute);display:block;margin-bottom:3px}
  .m.u .who{color:var(--accent)}
  .body{white-space:pre-wrap;word-break:break-word}
  .body strong{font-weight:650}

  /* ---- Text Dots（参考 21st #28400） ---- */
  .dots{color:var(--mute)}
  .dots i{font-style:normal;animation:dot 2s infinite;opacity:0}
  .dots i:nth-child(1){animation-name:d1}.dots i:nth-child(2){animation-name:d2}.dots i:nth-child(3){animation-name:d3}
  @keyframes d1{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}
  @keyframes d2{0%,40%{opacity:0}80%{opacity:1}100%{opacity:0}}
  @keyframes d3{0%,60%{opacity:0}80%{opacity:1}100%{opacity:0}}

  /* ---- Suggestions（参考 21st #26546） ---- */
  .empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:40px}
  .empty h2{font:600 30px/1.3 var(--serif);margin:0 0 6px}
  .empty p{color:var(--mute);margin:0 0 26px}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:560px}
  .chip{border:0;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;
        transition:background .2s,transform .2s var(--spring);animation:rise .5s var(--ease) both}
  .chip:hover{background:color-mix(in srgb,var(--ink) 11%,transparent);transform:translateY(-1px)}
  .chip:active{transform:scale(.97)}

  /* ---- AI Chat Input（参考 21st #2015） ---- */
  .composer{padding:10px 0 26px;flex:none}
  .box{background:#fff;border-radius:32px;height:64px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);
       transition:height .55s var(--spring),box-shadow .4s var(--ease);cursor:text}
  .box.open{height:118px;box-shadow:0 10px 34px rgba(0,0,0,.13)}
  .row{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 24px;height:64px}
  .field{position:relative;flex:1;height:100%}
  .field input{position:absolute;inset:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);z-index:1;width:100%}
  .ph{position:absolute;left:0;top:50%;transform:translateY(-50%);color:#a7a29a;pointer-events:none;white-space:nowrap;overflow:hidden;max-width:100%}
  .ph span{display:inline-block;animation:letterIn .5s var(--ease) both}
  .ph.out span{animation:letterOut .3s var(--ease) both}
  @keyframes letterIn{from{opacity:0;filter:blur(10px);transform:translateY(9px)}}
  @keyframes letterOut{to{opacity:0;filter:blur(10px);transform:translateY(-9px)}}
  .send{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .2s var(--spring),opacity .2s}
  .send:hover{transform:scale(1.06)}.send:disabled{opacity:.3;transform:none}
  .tools{display:flex;gap:8px;padding:0 18px 12px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
  .box.open .tools{opacity:1;transform:none;pointer-events:auto;transition-delay:.08s}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer;transition:all .2s}
  .pill:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 25%,transparent)}

  /* ---- 右栏 ---- */
  aside{width:368px;border-left:1px solid var(--line);padding:22px 24px 28px;overflow:auto;flex:none;scrollbar-width:thin}
  .seg{display:flex;gap:2px;background:color-mix(in srgb,var(--ink) 5%,transparent);padding:3px;border-radius:9px;position:relative;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;padding:5px 0;border-radius:7px;color:var(--mute);cursor:pointer;position:relative;z-index:1;transition:color .2s}
  .seg button.on{color:var(--ink)}
  .seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);transition:left .45s var(--spring),width .45s var(--spring)}

  /* ---- Market Snapshot（参考 21st #22249） ---- */
  .snap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .snap-h{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 4px}
  .snap-h small{font-size:11px;color:var(--mute);font-weight:500}
  .price{display:flex;align-items:baseline;gap:8px;margin-top:2px;flex-wrap:wrap}
  .price .big{font-size:23px;font-weight:650;letter-spacing:-.03em;display:inline-block}
  .price .big.pop{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}}
  .price .d{font-size:11.5px;font-weight:650}
  .sym{font:600 11px var(--mono);letter-spacing:.06em}
  .chart{position:relative;padding:0 10px}
  .chart svg{width:100%;display:block;touch-action:none}
  .chart path.ln{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chart path.ar{opacity:.09}
  .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10px;color:var(--mute);box-shadow:0 6px 18px rgba(0,0,0,.12);pointer-events:none;white-space:nowrap}
  .periods{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 12px 0;position:relative}
  .periods button{border:0;background:transparent;font:600 10.5px var(--mono);padding:6px 9px;border-radius:6px;color:var(--mute);cursor:pointer;transition:all .2s}
  .periods button.on{color:var(--ink);background:color-mix(in srgb,var(--ink) 5.5%,transparent)}
  .bar{position:absolute;bottom:-5px;height:3px;border-radius:3px 3px 0 0;transition:left .4s var(--spring),width .4s var(--spring),background .3s}
  .snap-f{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);padding:12px 18px 13px}

  /* ---- Sparkline 列表（参考 21st #35038） ---- */
  .list{margin-top:12px}
  .li{display:grid;grid-template-columns:1fr 64px 76px;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;transition:background .2s}
  .li:hover,.li.on{background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
  .li .n{font-size:13.5px;line-height:1.3}.li .n small{display:block;font:10.5px var(--mono);color:var(--mute)}
  .li .r{text-align:right;font-size:13px;line-height:1.3}.li .r small{display:block;font-size:11px;font-weight:600}
  .li svg{width:64px;height:24px}

  .sec{margin-top:26px}
  .sec h3{font:11px var(--mono);letter-spacing:.14em;color:var(--mute);margin:0 0 8px;font-weight:400;display:flex;justify-content:space-between}
  .sec ul{margin:0;padding:0;list-style:none}
  .sec li{font-size:13px;line-height:1.55;padding:7px 0;border-top:1px solid var(--line)}
  .sec li:first-child{border-top:0}
  .ledger{display:flex;gap:18px;align-items:baseline}
  .ledger .big{font:600 28px/1 var(--serif)}
  .ledger small{color:var(--mute);font-size:12px}
  .muted{color:var(--mute);font-size:13px}
  .note{font-size:11px;color:var(--mute);margin-top:22px;line-height:1.6}
  @media(max-width:980px){aside{display:none}main{padding:0 18px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ticker" id="ticker"><div class="ticker-track" id="track"><span class="tk"><span class="p">行情加载中…</span></span></div></div>
<div class="wrap">
<main>
  <header><h1>股市 Agent</h1><span class="tag">A股 · 港股 · 美股 · 有记忆</span></header>
  <div id="log"></div>
  <div class="composer">
    <form class="box" id="box">
      <div class="row">
        <div class="field"><input id="t" autocomplete="off" aria-label="输入消息"><div class="ph" id="ph"></div></div>
        <button class="send" id="b" aria-label="发送" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="tools" id="tools"></div>
    </form>
  </div>
</main>
<aside>
  <div class="seg" id="seg"><span class="thumb" id="thumb"></span></div>
  <div class="snap" id="snap">
    <div class="snap-h"><div><small id="sn">—</small><div class="price num"><span class="big" id="sp">—</span><span class="d" id="sd"></span></div></div><span class="sym" id="ss"></span></div>
    <div class="chart" id="chart"><svg id="svg" viewBox="0 0 320 150" role="img"></svg><div class="tip num" id="tip" hidden></div></div>
    <div class="periods" id="periods"><span class="bar" id="bar"></span></div>
    <div class="snap-f num"><span id="upd">—</span><span id="mk">—</span></div>
  </div>
  <div class="list" id="list"></div>
  <div class="sec"><h3>判断账本</h3><div id="calls" class="muted">—</div></div>
  <div class="sec"><h3><span>关于你</span><span id="uu"></span></h3><ul id="user"></ul></div>
  <div class="sec"><h3><span>我的笔记</span><span id="mu"></span></h3><ul id="mem"></ul></div>
  <div class="note">红涨绿跌。行情约 10 分钟更新一次，仅供参考，不构成投资建议。</div>
</aside>
</div>
<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token') || localStorage.token || '';
if (token) localStorage.token = token;
const H = {'Content-Type':'application/json','X-Token':token};
const sid = localStorage.sid || (localStorage.sid = Math.random().toString(36).slice(2));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => Number(v).toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
const cls = v => v >= 0 ? 'up' : 'down';
const sign = v => (v >= 0 ? '+' : '') ;

/* ---------- 聊天 ---------- */
const SUGGEST = ['今天 A 股怎么样', '港股科技股还能追吗', '美股隔夜发生了什么', '我持有腾讯，成本 400', '帮我复盘最近的判断', '看看英伟达的技术面'];
const log = $('log');
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#+\s*(.+)$/gm,'<strong>$1</strong>'); }
function empty(){
  log.innerHTML = `<div class="empty"><h2>今天想看什么？</h2><p>我记得你的持仓和偏好，判断会记账，到期自己复盘。</p><div class="chips">${
    SUGGEST.map((s,i)=>`<button class="chip" style="animation-delay:${i*45}ms">${esc(s)}</button>`).join('')}</div></div>`;
  log.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));
}
function add(role, html){
  if (log.querySelector('.empty')) log.innerHTML = '';
  const d = document.createElement('div'); d.className = 'm' + (role === 'u' ? ' u' : '');
  d.innerHTML = `<span class="who">${role === 'u' ? 'YOU' : 'AGENT'}</span><div class="body">${html}</div>`;
  log.append(d); log.scrollTop = 1e9; return d.querySelector('.body');
}
let busy = false;
async function send(text){
  text = (text ?? input.value).trim(); if (!text || busy) return;
  input.value = ''; sync(); busy = true; $('b').disabled = true;
  add('u', esc(text));
  const out = add('a', '<span class="dots">思考中<i>.</i><i>.</i><i>.</i></span>');
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:H, body:JSON.stringify({text, session:sid})});
    const j = await r.json(); out.innerHTML = md(j.reply || j.error || '（空回复）');
  } catch (e) { out.textContent = '请求失败：' + e; }
  busy = false; sync(); log.scrollTop = 1e9; loadMemory();
}

/* ---------- 输入框（AI Chat Input） ---------- */
const PH = ['问问今天大盘怎么走', '告诉我你的持仓和成本', '恒生科技最近为什么跌', '帮我看看茅台的 RSI', '上周的判断对了吗'];
const TOOLS = [['今日行情','今天三个市场整体怎么样？'],['我的持仓','看看我的持仓现在怎么样'],['复盘','帮我复盘到期的判断'],['新开对话','/new']];
const box = $('box'), input = $('t'), ph = $('ph');
$('tools').innerHTML = TOOLS.map(([l]) => `<button type="button" class="pill">${l}</button>`).join('');
$('tools').querySelectorAll('.pill').forEach((p,i) => p.onclick = e => { e.stopPropagation(); send(TOOLS[i][1]); });
let phi = 0;
function showPh(){ ph.className = 'ph'; ph.innerHTML = [...PH[phi]].map((c,i)=>`<span style="animation-delay:${i*25}ms">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join(''); }
function sync(){
  const active = document.activeElement === input || input.value;
  box.classList.toggle('open', !!active);
  ph.style.display = (active ? 'none' : '');
  $('b').disabled = busy || !input.value.trim();
}
setInterval(() => { if (document.activeElement === input || input.value) return;
  ph.classList.add('out'); setTimeout(() => { phi = (phi + 1) % PH.length; showPh(); }, 380); }, 3000);
box.onclick = () => input.focus();
input.onfocus = input.oninput = sync;
document.addEventListener('mousedown', e => { if (!box.contains(e.target)) setTimeout(() => { if (!input.value) { input.blur(); sync(); } }); });
box.onsubmit = e => { e.preventDefault(); send(); };
showPh(); sync(); empty();

/* ---------- 行情 ---------- */
const MARKETS = ['A股','港股','美股','自选'];
const PERIODS = [['1W',5],['1M',22],['3M',66],['6M',126],['1Y',260]];
let items = [], market = 'A股', cur = null, period = '1M', updated = '';
const W = 320, HH = 150;

function spark(c, w=64, h=24){
  const d = c.slice(-22), mn = Math.min(...d), mx = Math.max(...d);
  const p = d.map((v,i)=>`${i?'L':'M'}${(i/(d.length-1)*w).toFixed(1)} ${(2+(1-(v-mn)/(mx-mn||1))*(h-4)).toFixed(1)}`).join(' ');
  const col = d[d.length-1] >= d[0] ? 'var(--up)' : 'var(--down)';
  return `<svg viewBox="0 0 ${w} ${h}"><path d="${p} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".1"/><path d="${p}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}
function ticker(){
  if (!items.length) return;
  const one = items.filter(x => x.market !== '自选').map(x => `<span class="tk num" data-s="${esc(x.symbol)}"><b>${esc(x.name)}</b><span class="p">${fmt(x.last)}</span><span class="c ${cls(x.pct)}"><span class="tri">${x.pct>=0?'▲':'▼'}</span>${sign(x.pct)}${fmt(x.pct)}%</span></span>`).join('');
  $('track').innerHTML = one + one;
  $('track').querySelectorAll('.tk').forEach(t => t.onclick = () => { const x = items.find(i => i.symbol === t.dataset.s); market = x.market; select(x); });
}
function seg(){
  const ms = MARKETS.filter(m => m !== '自选' || items.some(x => x.market === '自选'));
  const s = $('seg'); s.querySelectorAll('button').forEach(b => b.remove());
  ms.forEach(m => { const b = document.createElement('button'); b.textContent = m; b.className = m === market ? 'on' : '';
    b.onclick = () => { market = m; select(items.find(x => x.market === m)); }; s.append(b); });
  requestAnimationFrame(() => { const on = s.querySelector('.on'); if (on) Object.assign($('thumb').style, {left: on.offsetLeft+'px', width: on.offsetWidth+'px'}); });
}
function list(){
  $('list').innerHTML = items.filter(x => x.market === market).map(x => `<div class="li num ${cur && x.symbol===cur.symbol?'on':''}" data-s="${esc(x.symbol)}">
    <div class="n">${esc(x.name)}<small>${esc(x.symbol)}</small></div>${spark(x.closes)}
    <div class="r">${fmt(x.last)}<small class="${cls(x.pct)}">${sign(x.pct)}${fmt(x.pct)}%</small></div></div>`).join('');
  $('list').querySelectorAll('.li').forEach(l => l.onclick = () => select(items.find(x => x.symbol === l.dataset.s)));
}
function periods(){
  const p = $('periods'); p.querySelectorAll('button').forEach(b => b.remove());
  PERIODS.forEach(([k]) => { const b = document.createElement('button'); b.textContent = k; b.className = k === period ? 'on' : '';
    b.onclick = () => { period = k; periods(); chart(); }; p.append(b); });
  requestAnimationFrame(() => { const on = p.querySelector('.on'); if (on) Object.assign($('bar').style, {left: on.offsetLeft+6+'px', width: on.offsetWidth-12+'px'}); });
}
function head(v, base, date){
  const big = $('sp'), d = v - base, pc = d / base * 100;
  const txt = fmt(v); if (big.textContent !== txt) { big.textContent = txt; big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop'); }
  $('sd').className = 'd ' + cls(d); $('sd').textContent = `${sign(d)}${fmt(d)}（${sign(pc)}${fmt(pc)}%）· ${period}`;
  $('upd').textContent = date ? date : `更新于 ${updated}`;
}
function chart(){
  if (!cur) return;
  const n = PERIODS.find(p => p[0] === period)[1];
  const data = cur.closes.slice(-n-1), dates = cur.dates.slice(-n-1);
  const short = data.length < 3;
  const mn = Math.min(...data)*0.997, mx = Math.max(...data)*1.003;
  const x = i => 8 + i/(Math.max(data.length-1,1))*(W-16), y = v => 8 + (1-(v-mn)/(mx-mn||1))*(HH-18);
  const line = data.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const col = data[data.length-1] >= data[0] ? 'var(--up)' : 'var(--down)';
  $('bar').style.background = col;
  $('svg').innerHTML = [.33,.66].map(p => `<line x1="8" x2="${W-8}" y1="${8+p*(HH-18)}" y2="${8+p*(HH-18)}" stroke="var(--line)" stroke-dasharray="2 5"/>`).join('')
    + `<path class="ar" d="${line} L${x(data.length-1)} ${HH} L8 ${HH}Z" fill="${col}"/><path class="ln" id="ln" d="${line}" stroke="${col}"/><g id="hv"></g>`
    + (short ? `<text x="${W/2}" y="${HH/2}" text-anchor="middle" font-size="11" fill="var(--mute)">历史数据不足，只显示最新价</text>` : '');
  const ln = $('ln'), L = ln.getTotalLength();
  ln.style.strokeDasharray = L; ln.style.strokeDashoffset = L;
  ln.getBoundingClientRect(); ln.style.transition = 'stroke-dashoffset .65s var(--ease)'; ln.style.strokeDashoffset = 0;
  head(data[data.length-1], data[0]);
  const svg = $('svg'), tip = $('tip');
  svg.onpointermove = e => {
    const b = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(data.length-1, Math.round((e.clientX-b.left)/b.width*(data.length-1))));
    $('hv').innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="8" y2="${HH-10}" stroke="color-mix(in srgb,var(--ink) 18%,transparent)"/><circle cx="${x(i)}" cy="${y(data[i])}" r="3.2" fill="${col}" stroke="var(--card)" stroke-width="1.5"/>`;
    tip.hidden = false; tip.style.left = (x(i)/W*100) + '%'; tip.textContent = dates[i];
    head(data[i], data[0], dates[i]);
  };
  svg.onpointerleave = () => { $('hv').innerHTML = ''; tip.hidden = true; head(data[data.length-1], data[0]); };
}
function select(x){
  if (!x) return; cur = x;
  $('sn').textContent = x.name; $('ss').textContent = x.symbol; $('mk').textContent = x.market;
  seg(); list(); chart();
}
async function loadIndices(){
  try {
    const j = await (await fetch('/api/indices', {headers:H})).json();
    if (!j.items || !j.items.length) { $('track').innerHTML = '<span class="tk"><span class="p">行情暂时取不到</span></span>'; return; }
    items = j.items; updated = j.updated;
    ticker(); select(cur ? items.find(i => i.symbol === cur.symbol) || items[0] : items.find(i => i.market === market) || items[0]);
  } catch (e) {}
}

/* ---------- 记忆 ---------- */
async function loadMemory(){
  try {
    const r = await (await fetch('/api/memory', {headers:H})).json();
    const fill = (id, a) => $(id).innerHTML = (a.length ? a : ['（还没有）']).map(x => `<li>${esc(x)}</li>`).join('');
    fill('user', r.user); fill('mem', r.memory);
    $('uu').textContent = r.usage.user; $('mu').textContent = r.usage.memory;
    const c = r.calls || {}, ok = c['对'] || 0, bad = c['错'] || 0, n = ok + bad;
    $('calls').innerHTML = n
      ? `<div class="ledger"><span class="big num">${Math.round(ok/n*100)}%</span><small>命中 ${ok}/${n} · 待复盘 ${c.open||0}</small></div>`
      : `暂无已复盘的判断 · 待复盘 ${c.open||0}`;
  } catch (e) {}
}
periods(); seg(); loadIndices(); loadMemory();
setInterval(loadIndices, 10*60*1000);
addEventListener('resize', () => { seg(); periods(); });
</script>
