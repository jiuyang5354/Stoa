# Stoa 配置
# 代码用 Yahoo Finance 格式：
#   A股 上交所 600519.SS / 深交所 000858.SZ
#   港股 0700.HK（4 位数字）
#   美股 AAPL、NVDA
indices:
  A股:
    - {symbol: "000001.SS", name: "上证指数"}
    - {symbol: "399001.SZ", name: "深证成指"}
    - {symbol: "399006.SZ", name: "创业板指"}
  港股:
    - {symbol: "^HSI", name: "恒生指数"}
    - {symbol: "HSTECH.HK", name: "恒生科技"}
  美股:
    - {symbol: "^GSPC", name: "标普500"}
    - {symbol: "^IXIC", name: "纳斯达克"}
    - {symbol: "^DJI", name: "道琼斯"}

# 自选股：加上你想盯的股票
watchlist: []
#  - {symbol: "600519.SS", name: "贵州茅台"}
#  - {symbol: "0700.HK", name: "腾讯控股"}
#  - {symbol: "NVDA", name: "英伟达"}

# 提醒阈值
alerts:
  daily_move_pct: 3.0     # 单日涨跌超过这个百分比就标出
  rsi_overbought: 70
  rsi_oversold: 30

# 大模型：环境变量 LLM_PROVIDER / LLM_MODEL 优先；这里是没设环境变量时的默认值
# provider 可选：deepseek openai anthropic gemini qwen kimi zhipu doubao hunyuan minimax stepfun baichuan
#   siliconflow openrouter groq together fireworks mistral xai perplexity ollama lmstudio vllm azure
llm:
  provider: deepseek
  model: deepseek-chat
  # 密钥放环境变量 LLM_API_KEY，不要写在这里

# Agora 多角色深度分析（「深度分析 X」「该不该买 X」时触发）
debate:
  rounds: 1            # 多空辩论轮数 1–3
  max_calls: 14        # 每次深度分析最多调用大模型次数（4 分析师 + 2×轮数 + 风控 + 裁决 + 1 次核对修订）
  max_tokens: 60000    # 估算 token 上限，超了后面的角色降级
  role_timeout: 60     # 每个角色的超时（秒），超时的角色降级为规则摘要
  horizon_days: 20     # 结论的观察周期（交易日），也是记账复盘的期限

