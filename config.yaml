# Stoa 配置
# 代码用 Yahoo Finance 格式：
#   A股 上交所 600519.SS / 深交所 000858.SZ
#   港股 0700.HK（4 位数字）
#   美股 AAPL、NVDA
indices:
  A股:
    - {symbol: "000001.SS", name: "上证指数"}
    - {symbol: "399001.SZ", name: "深证成指"}
    - {symbol: "399006.SZ", name: "创业板指"}
  港股:
    - {symbol: "^HSI", name: "恒生指数"}
    - {symbol: "HSTECH.HK", name: "恒生科技"}
  美股:
    - {symbol: "^GSPC", name: "标普500"}
    - {symbol: "^IXIC", name: "纳斯达克"}
    - {symbol: "^DJI", name: "道琼斯"}

# 自选股：加上你想盯的股票
watchlist: []
#  - {symbol: "600519.SS", name: "贵州茅台"}
#  - {symbol: "0700.HK", name: "腾讯控股"}
#  - {symbol: "NVDA", name: "英伟达"}

# 提醒阈值
alerts:
  daily_move_pct: 3.0     # 单日涨跌超过这个百分比就标出
  rsi_overbought: 70
  rsi_oversold: 30

# 大模型：环境变量 LLM_PROVIDER / LLM_MODEL 优先；这里是没设环境变量时的默认值
# provider 可选：deepseek openai anthropic gemini qwen kimi zhipu doubao hunyuan minimax stepfun baichuan
#   siliconflow openrouter groq together fireworks mistral xai perplexity ollama lmstudio vllm azure
llm:
  provider: deepseek
  model: deepseek-chat
  # 密钥放环境变量 LLM_API_KEY，不要写在这里

# Agora 多角色深度分析（「深度分析 X」「该不该买 X」时触发）
debate:
  rounds: 1            # 多空辩论轮数 1–3
  max_calls: 14        # 每次深度分析最多调用大模型次数（4 分析师 + 2×轮数 + 风控 + 裁决 + 1 次核对修订）
  max_tokens: 60000    # 估算 token 上限，超了后面的角色降级
  role_timeout: 60     # 每个角色的超时（秒），超时的角色降级为规则摘要
  horizon_days: 20     # 结论的观察周期（交易日），也是记账复盘的期限
  # 分角色模型（可选，留空 = 都用上面 llm 的默认模型）。写「模型名」或「服务商:模型名」；环境变量 DEBATE_ANALYST_MODEL / DEBATE_JUDGE_MODEL 优先
  # analyst_model: ""  # 四位分析师 + 多空研究员
  # judge_model: ""    # 风控官、基金经理裁决、核对修订

# 对话 Agent（v0.17）：工具循环最多几轮（上下文预算先用完会提前收尾）；上下文窗口按模型预设，LLM_CONTEXT 可覆盖
# 仓位上限测算（v0.40，position_limit 工具）：几道约束取最小，被钳掉的部分留现金。只是算术上限，不是买入建议
risk:
  max_weight: {保守: 0.10, 稳健: 0.20, 积极: 0.30}       # 单票最多占可用资金的比例
  adv_pct: 0.01                                           # 最多买 20 日均成交额的 1%
  risk_per_trade: {保守: 0.005, 稳健: 0.01, 积极: 0.02}  # 止损下的亏损最多占资金的比例
  atr_mult: {保守: 1.5, 稳健: 2.0, 积极: 2.5}            # 没给止损幅度时：止损参考价 = 现价 − 倍数 × ATR14

agent:
  max_tool_rounds: 12
  turn_timeout: 900    # 单轮（一问）总时长上限，秒；到点前留出收尾时间，用已拿到的结果作答并注明未完成部分

# 自进化（v0.39 Eruditio）：每轮后台复盘写技能、curator 管技能生命周期、离线进化过训练/留出闸门（python -m stock_agent evolve）
evolve:
  review: on            # 每轮结束后台复盘（用过 ≥ review_min_tools 个工具、或用户在纠正时才复盘）；off 关掉
  review_model: ""      # 复盘/离线提议用的辅助模型；留空 = 深度分析的分析师模型，再没有就用默认模型。写「模型名」或「服务商:模型名」
  review_min_tools: 1     # 用过 ≥ 这个数的工具就复盘
  review_min_chars: 600   # 1–2 个工具的轮次，回答短于这个数不复盘（省调用）
  review_gap: 300       # 两次「研究套路」复盘至少间隔秒数（纠正不受限）
  write_approval:       # auto = 直接生效（可回滚）；approve = 进待确认。风控/出处/注入/确认相关的改动永远要批准，这里改不了
    skills: auto
    memory: auto
    prompts: approve    # 系统提示补充、工具描述补充
    rules: approve
  gate:
    holdout: 0.35       # 留出题比例：提议者看不到这些题的失败；留出题不退步且训练题有提升才生效
    max_edits: 3        # 每个候选最多几条改动（每多一轮减 1）
    max_edit_chars: 1200
  curator:
    enabled: on
    interval_hours: 24
    stale_after_days: 14
    archive_after_days: 30

# 财报事件（v0.17）：跟踪 USER.md 持仓 + 自选股的财报日，财报前提醒、财报后自动生成事件研报（data/reports/events/）
earnings:
  enabled: on
  remind_days: 3       # 财报前几天提醒（含市场预期与上次判断回顾）
  refresh_hours: 12    # 财报日历多久刷新一次
  debate: false        # 研报后顺带跑一次 Agora 辩论（会多调用十来次模型）
